<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101215">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DMTX Console</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/console.css">
  <script src="/static/console.js" defer></script>
</head>
<body>
  <main class="console-shell">
    <header>
      <h1>DMTX Console</h1>
      <p id="command-summary">Loading commands…</p>
    </header>
    <section id="transcript" aria-label="Command transcript" aria-live="polite" aria-relevant="additions text"></section>
    <output id="console-status" role="status" aria-live="polite" aria-atomic="true">Ready.</output>
    <form id="command-form">
      <label for="line">Command</label>
      <div class="command-entry">
        <span aria-hidden="true">›</span>
        <input id="line" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" autocomplete="off" autofocus placeholder="/status --state state.db">
      </div>
      <div id="suggestions" role="listbox" aria-label="Command suggestions" hidden></div>
      <button type="submit">Run</button>
      <button id="cancel" type="button" disabled>Cancel job</button>
    </form>
  </main>
</body>
</html>
